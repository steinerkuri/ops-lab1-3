name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Release gate
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release rejected: tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not an ancestor of origin/main."
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.9'

      - name: Quality checks
        run: make fmt-check vet test

      - name: Package and print checksums
        shell: bash
        env:
          BUILD_NO: ${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          make package \
            VERSION="$VERSION" \
            BUILD_NO="$BUILD_NO" \
            RUN_ID="$RUN_ID" \
            COMMIT="$GITHUB_SHA"

          P="dist/enroll-conflict_${VERSION}_linux_amd64"
          sha256sum "$P/enroll-conflict"
          sha256sum "${P}.tar.gz"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz dist/*.tar.gz.sha256 \
            --verify-tag \
            --notes "Release $GITHUB_REF_NAME"
